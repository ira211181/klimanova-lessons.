<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Місія: Робочий стіл — 2 клас</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;background:linear-gradient(125deg,#d9f5ff,#fce3ff,#fff2c9);color:#203252;min-height:100vh}.wrap{max-width:850px;margin:auto;padding:22px}.hero{text-align:center;background:#fff;border:4px solid #8ed8ff;border-radius:26px;padding:22px;box-shadow:0 9px 0 #8ed8ff}h1{margin:0;color:#6544b8;font-size:clamp(25px,5vw,40px)}h2{font-size:clamp(21px,4vw,30px)}.sub{font-size:19px}.stats{display:flex;justify-content:space-between;gap:10px;font-weight:800;margin:20px 0}.pill{background:white;border-radius:25px;padding:10px 18px}.progress{height:17px;background:#fff;border-radius:20px;overflow:hidden;margin:15px 0}.fill{background:#52cba4;height:100%;width:0;transition:.3s}.panel{background:white;border-radius:26px;padding:26px;box-shadow:0 10px 30px #7d85b033}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.option,.action,.step{border:3px solid #cbd8ff;border-radius:16px;background:#f6f8ff;padding:15px;cursor:pointer;font-size:18px;font-weight:650;text-align:left;color:#233657}.option:hover,.step:hover{background:#e9efff}.selected{border-color:#6552dc;background:#e8e2ff}.correct{border-color:#24a86a;background:#d9ffe9}.wrong{border-color:#e94b66;background:#ffe3e8}.btn{border:0;border-radius:15px;background:#6552dc;color:white;padding:14px 22px;font-size:18px;font-weight:800;cursor:pointer;margin-top:16px}.btn:disabled{background:#b2b2c9;cursor:default}.secondary{background:#159d9a}.feedback{margin-top:16px;padding:14px;border-radius:14px;background:#fff3cc;font-size:18px;font-weight:700}.hint{color:#5e6983}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.pair label{font-size:17px;font-weight:700}.pair select{width:100%;padding:10px;border:2px solid #b5bff5;border-radius:10px;font-size:16px}.sequence{display:grid;gap:9px}.step{display:flex;align-items:center;justify-content:space-between;gap:12px}.arrows button{font-size:20px;padding:5px 11px;border:0;border-radius:8px;background:#d7d0ff;cursor:pointer}.foot{text-align:center;padding:20px;color:#5c6180}@media(max-width:500px){.pair{grid-template-columns:1fr}.panel{padding:17px}.stats{font-size:14px}}
</style></head><body><div class="wrap"><header class="hero"><h1>🖥️ Місія «Робочий стіл»</h1><div class="sub">🎒 Інформатика • 2 клас • 12 веселих завдань</div></header><div class="stats"><span class="pill" id="count">Завдання 1 / 12</span><span class="pill" id="score">⭐ 0 балів</span></div><div class="progress"><div class="fill" id="fill"></div></div><main class="panel" id="game"></main><div class="foot">🌈 Думай, обирай, перевіряй!</div></div><script>
const Q=[
{t:'single',q:'Що ми бачимо на екрані після запуску комп’ютера та входу в систему?',a:['Робочий стіл','Принтер','Клавіатуру'],ok:[0],why:'Робочий стіл — основний простір для роботи з комп’ютером.'},
{t:'multi',q:'Що може бути на робочому столі комп’ютера?',a:['Значки програм','Папки','Кошик','Справжній олівець'],ok:[0,1,2],why:'На робочому столі можуть бути значки програм, папки та Кошик.'},
{t:'single',q:'Як називається маленьке зображення, що позначає програму або файл?',a:['Значок','Монітор','Миша'],ok:[0],why:'Таке зображення називається значком.'},
{t:'pair',q:'З’єднай об’єкт з його призначенням.',left:['🗑️ Кошик','📁 Папка','🖱️ Вказівник'],right:['Показує місце вказування','Містить файли та інші папки','Зберігає видалені об’єкти до очищення'],ok:[2,1,0],why:'Кошик — для видалених об’єктів, папка — для зберігання, вказівник — для вибору.'},
{t:'single',q:'Якою дією миші зазвичай відкривають значок програми на робочому столі?',a:['Подвійним клацанням лівою кнопкою','Одним рухом миші','Натисканням пробілу'],ok:[0],why:'Зазвичай програму зі значка відкривають подвійним клацанням.'},
{t:'multi',q:'Що можна зробити за допомогою миші?',a:['Вибрати значок','Перетягнути значок','Відкрити папку','Надрукувати аркуш без принтера'],ok:[0,1,2],why:'Мишею можна вибирати, перетягувати й відкривати об’єкти.'},
{t:'order',q:'Розташуй дії, щоб відкрити папку на робочому столі.',a:['Знайти значок папки','Навести вказівник на значок','Двічі клацнути лівою кнопкою'],why:'Спочатку знаходимо папку, наводимо вказівник, потім двічі клацаємо.'},
{t:'pair',q:'Добери назву до опису.',left:['🖼️ Фон робочого столу','📋 Панель завдань','🪟 Вікно'],right:['Прямокутна область відкритої програми','Зображення позаду значків','Смуга зі значками відкритих або закріплених програм'],ok:[1,2,0],why:'Фон прикрашає стіл, панель допомагає перемикати програми, вікно показує вміст.'},
{t:'single',q:'Куди зазвичай потрапляє видалений файл у Windows?',a:['У Кошик','У клавіатуру','На принтер'],ok:[0],why:'Зазвичай видалений файл переміщується до Кошика.'},
{t:'multi',q:'Обери правила безпечної роботи з робочим столом.',a:['Не видаляти чужі файли','Питати дозволу перед зміною налаштувань','Обережно відкривати незнайомі файли','Натискати все підряд'],ok:[0,1,2],why:'Працюй уважно та запитуй учителя, якщо не впевнений.'},
{t:'order',q:'Розташуй дії для переміщення значка мишею.',a:['Навести вказівник на значок','Натиснути й утримувати ліву кнопку','Перемістити мишу в потрібне місце','Відпустити кнопку'],why:'Це послідовність перетягування значка.'},
{t:'pair',q:'Фінальна місія! Установи відповідність.',left:['📁 Папка','🗑️ Кошик','🖥️ Робочий стіл','📋 Панель завдань'],right:['Місце для файлів','Допомагає перемикати вікна','Робоча область екрана','Місце для видалених об’єктів'],ok:[0,3,2,1],why:'Ти повторив основні елементи робочого столу!'}
];let i=0,score=0,chosen=[],order=[],locked=false;
const el=id=>document.getElementById(id);const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){locked=false;chosen=[];const q=Q[i];el('count').textContent='Завдання '+(i+1)+' / 12';el('score').textContent='⭐ '+score+' балів';el('fill').style.width=(i/12*100)+'%';let html='<h2>🎯 '+escapeHtml(q.q)+'</h2>';if(q.t==='single'||q.t==='multi'){html+='<p class="hint">'+(q.t==='multi'?'☑️ Обери всі правильні відповіді.':'🔘 Обери одну відповідь.')+'</p><div class="options">'+q.a.map((v,j)=>'<button class="option" data-choice="'+j+'">'+escapeHtml(v)+'</button>').join('')+'</div>'}if(q.t==='pair'){html+='<p class="hint">🔗 Для кожного об’єкта вибери правильний опис.</p>'+q.left.map((v,j)=>'<div class="pair"><label for="p'+j+'">'+escapeHtml(v)+'</label><select id="p'+j+'"><option value="">— Обери опис —</option>'+q.right.map((r,k)=>'<option value="'+k+'">'+escapeHtml(r)+'</option>').join('')+'</select></div>').join('')}if(q.t==='order'){html+='<p class="hint">🔢 Кнопками ↑ ↓ розташуй дії у правильному порядку.</p><div class="sequence" id="sequence"></div>';order=q.a.map((_,j)=>j).reverse()}html+='<button class="btn" id="check">✅ Перевірити</button><div id="feedback" aria-live="polite"></div><div id="next"></div>';el('game').innerHTML=html;if(q.t==='order')drawOrder();document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(locked)return;const j=Number(b.dataset.choice);if(q.t==='single')chosen=[j];else chosen=chosen.includes(j)?chosen.filter(x=>x!==j):[...chosen,j];document.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('selected',chosen.includes(Number(x.dataset.choice))))});el('check').onclick=check}
function drawOrder(){el('sequence').innerHTML=order.map((idx,pos)=>'<div class="step"><span>'+(pos+1)+'. '+escapeHtml(Q[i].a[idx])+'</span><span class="arrows"><button data-pos="'+pos+'" data-dir="-1" aria-label="Вгору">↑</button> <button data-pos="'+pos+'" data-dir="1" aria-label="Вниз">↓</button></span></div>').join('');document.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{if(locked)return;let p=+b.dataset.pos,n=p+(+b.dataset.dir);if(n<0||n>=order.length)return;[order[p],order[n]]=[order[n],order[p]];drawOrder()})}
function check(){if(locked)return;const q=Q[i];let good=false;if(q.t==='single'||q.t==='multi'){if(!chosen.length){el('feedback').innerHTML='<div class="feedback">Спочатку обери відповідь 🙂</div>';return}good=chosen.length===q.ok.length&&chosen.every(x=>q.ok.includes(x));document.querySelectorAll('[data-choice]').forEach(b=>{let n=+b.dataset.choice;b.classList.remove('selected');if(q.ok.includes(n))b.classList.add('correct');else if(chosen.includes(n))b.classList.add('wrong')})}else if(q.t==='pair'){let vals=q.left.map((_,j)=>el('p'+j).value);if(vals.some(x=>x==='')){el('feedback').innerHTML='<div class="feedback">Обери опис для кожного об’єкта 🙂</div>';return}good=vals.every((v,j)=>+v===q.ok[j]);q.left.forEach((_,j)=>{el('p'+j).style.borderColor=(+vals[j]===q.ok[j]?'#24a86a':'#e94b66')})}else good=order.every((x,j)=>x===j);locked=true;if(good)score++;el('score').textContent='⭐ '+score+' балів';el('check').disabled=true;document.querySelectorAll('select').forEach(x=>x.disabled=true);el('feedback').innerHTML='<div class="feedback">'+(good?'🌟 Правильно! +1 бал.':'💡 Цього разу без бала.')+' '+escapeHtml(q.why)+'</div>';el('next').innerHTML='<button class="btn secondary" id="go">'+(i===11?'🏆 Побачити результат':'➡️ Наступне завдання')+'</button>';el('go').onclick=()=>{i++;if(i===12)finish();else render()}}
function finish(){el('fill').style.width='100%';el('count').textContent='Усі 12 завдань виконано';el('score').textContent='⭐ '+score+' / 12';el('game').innerHTML='<div style="text-align:center"><div style="font-size:65px">🏆🎉</div><h2>Місію завершено!</h2><p class="sub">Твій результат:</p><h1>'+score+' / 12 балів</h1><p class="sub">'+(score>=10?'Чудово знаєш робочий стіл!':score>=7?'Гарний результат! Повтори складні завдання.':'Спробуй ще раз — у тебе вийде!')+'</p><button class="btn" id="restart">🔄 Грати ще раз</button></div>';el('restart').onclick=()=>{i=0;score=0;render()}}render();
</script></body></html>
