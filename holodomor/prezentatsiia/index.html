const slides=[...document.querySelectorAll('.slide')];let current=0;const dots=document.getElementById('dots');slides.forEach((s,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','Слайд '+(i+1));b.onclick=()=>show(i);dots.append(b)});function show(i){current=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,j)=>{s.classList.toggle('active',j===current);s.setAttribute('aria-hidden',j!==current)});[...dots.children].forEach((d,j)=>d.classList.toggle('active',j===current));document.getElementById('counter').textContent=(current+1)+' / '+slides.length}function next(){show(current+1)}function prev(){show(current-1)}document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();next()}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev()}else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1)});show(0);
