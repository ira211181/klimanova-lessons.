<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новорічна 3D-гра — 2 клас</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 50% 10%,#536ed5,#271d65 55%,#100f35);min-height:100vh;overflow-x:hidden}body:before{content:"❄️　✦　❄️　✧　❄️　✦　❄️　✧　❄️";position:fixed;top:0;width:100%;text-align:center;font-size:30px;opacity:.5;pointer-events:none}.scene{max-width:1160px;margin:auto;padding:20px 18px 40px;text-align:center}.banner{background:linear-gradient(125deg,#fff0bf,#fff,#f6d28a);color:#38236d;border:8px solid #d7a348;border-radius:35px;box-shadow:0 12px 0 #6e3a20,0 25px 40px #0008;padding:14px;margin:12px auto 24px;max-width:920px;transform:perspective(900px) rotateX(3deg)}h1{font-size:clamp(23px,4vw,45px);margin:0;text-shadow:2px 3px #d6c2ed}.sub{font-weight:900;color:#a51e48;font-size:clamp(18px,2.5vw,29px)}.village{position:relative;background:linear-gradient(#3d317a88,#44214d88),repeating-linear-gradient(90deg,#6c3d2c 0 18px,#86513c 18px 22px);border:12px ridge #bc7b37;border-radius:32px;padding:26px 18px 30px;box-shadow:0 22px 0 #492515,0 40px 60px #0009}.village:before{content:"🎄";position:absolute;left:-12px;bottom:-25px;font-size:clamp(65px,13vw,145px);filter:drop-shadow(5px 10px 4px #0006)}.village:after{content:"⛄";position:absolute;right:-12px;bottom:-23px;font-size:clamp(65px,12vw,130px)}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:18px 10px;position:relative;z-index:1}.tile{position:relative;aspect-ratio:1/.99;min-height:72px;border:5px solid #f5d07d;border-bottom:11px solid #754125;border-radius:16px 16px 11px 11px;background:linear-gradient(130deg,#fff8 0 8%,transparent 9%),linear-gradient(155deg,var(--a),var(--b));box-shadow:inset 4px 5px 0 #fff6,inset -5px -5px 0 #0005,0 9px 0 #5c2b2b,0 13px 15px #0009;cursor:pointer;transition:transform .2s,filter .2s;transform:perspective(500px) rotateX(4deg)}.tile:before{content:"";position:absolute;left:44%;top:0;width:13%;height:100%;background:linear-gradient(90deg,#d48b21,#ffe381,#b87812);opacity:.95}.tile:after{content:"🎀";position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:clamp(20px,3vw,38px);filter:drop-shadow(2px 4px 2px #0008)}.tile:hover,.tile:focus-visible{transform:perspective(500px) rotateX(4deg) translateY(-9px) scale(1.05);filter:brightness(1.12)}.num{position:relative;z-index:2;display:inline-grid;place-items:center;width:58%;aspect-ratio:1;border-radius:18px;background:linear-gradient(#fff8dd,#e9bb6e);border:3px solid #a66a26;box-shadow:0 4px 6px #0006;color:#38214c;font-weight:1000;font-size:clamp(22px,3.4vw,42px);margin-top:25%}.tile.done{filter:saturate(.55)}.tile.done .num{background:#b5f4d5}.tile.done .num:after{content:"✓";position:absolute;right:-10px;top:-15px;color:green;background:white;border-radius:50%;font-size:18px;padding:3px}.bottom{margin:28px auto 0;max-width:720px;background:linear-gradient(#fff8e4,#f6d4a2);border:6px solid #c88d42;border-radius:24px;color:#4b286b;padding:10px 16px;font-weight:900;font-size:22px;box-shadow:0 10px #70411f}.bar{height:19px;border-radius:20px;background:#c7b1d8;overflow:hidden;margin-top:8px}.fill{height:100%;width:0;background:linear-gradient(90deg,#f3b122,#56cb74);transition:width .3s}.overlay{position:fixed;inset:0;z-index:9;background:#100a35b9;display:none;align-items:center;justify-content:center;padding:15px}.overlay.show{display:flex}.modal{width:min(100%,580px);max-height:95vh;overflow:auto;background:linear-gradient(#fff9e7,#ffe6b8);color:#32244b;border:8px solid #d5a14d;border-radius:24px;box-shadow:0 20px 70px #000b;transform:perspective(900px) rotateX(2deg)}.head{background:linear-gradient(90deg,#6746a5,#a255b4);color:white;padding:14px 20px;font-weight:900;font-size:23px;display:flex;justify-content:space-between}.close{border:0;border-radius:50%;background:#ffffff44;color:white;font-size:25px;cursor:pointer}.content{padding:22px}.question{font-size:23px;font-weight:800;background:white;padding:17px;border:2px dashed #c79b57;border-radius:12px;margin-bottom:16px}.answer{display:block;width:100%;text-align:left;margin:9px 0;background:#fff;border:2px solid #c8b9d9;border-radius:13px;padding:14px;font-size:18px;font-weight:700;cursor:pointer;color:#302341}.answer.sel{background:#e2d7ff;border-color:#6942b2}.answer.good{background:#d5f7dc;border-color:#2c9959}.answer.bad{background:#ffe0df;border-color:#d44b4b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{padding:12px;border-radius:13px;border:2px solid #bba1c5;background:#fff;font-weight:800;cursor:pointer}.actions button.primary{background:#7444b4;color:white}.feedback{font-weight:800;margin-top:15px;line-height:1.5}.snow{position:fixed;pointer-events:none;top:-20px;animation:fall linear infinite;opacity:.7}@keyframes fall{to{transform:translateY(110vh) rotate(180deg)}}@media(max-width:650px){.grid{grid-template-columns:repeat(4,1fr);gap:20px 8px}.tile{min-height:65px}.num{font-size:24px}.village{padding:25px 8px}.village:before,.village:after{opacity:.4}.banner{margin-top:15px}.question{font-size:19px}}
</style></head><body><main class="scene"><div class="banner"><div>💻 ІНФОРМАТИКА • 2 КЛАС 🎄</div><h1>Комп’ютерна програма.<br>Меню комп’ютерної програми</h1><div class="sub">✨ Новорічна 3D-гра-пригода ✨</div></div><div class="village"><div class="grid" id="grid"></div><div class="bottom">⭐ Виконано: <span id="count">0</span> з 20<div class="bar"><div class="fill" id="fill"></div></div></div></div><p>🎁 Відкривай подарунки, відповідай на запитання та рятуй новорічне містечко!</p></main><div class="overlay" id="overlay"><section class="modal" role="dialog" aria-modal="true"><div class="head"><span id="heading">Віконце</span><button class="close" onclick="closeModal()" aria-label="Закрити">×</button></div><div class="content"><div class="question" id="question"></div><div id="answers"></div><div class="actions"><button onclick="hint()">💡 Підказка</button><button class="primary" onclick="check()">✓ Перевірити</button><button onclick="reveal()">👁 Показати відповідь</button></div><div class="feedback" id="feedback" aria-live="polite"></div></div></section></div><script>
const tasks=[
["Що таке комп’ютерна програма?",["Набір команд для комп’ютера","Лише малюнок","Комп’ютерний стіл"],0,"Програма містить команди, які виконує комп’ютер."],
["Яка програма допомагає малювати?",["Калькулятор","Графічний редактор","Годинник"],1,"Для малювання використовують графічний редактор."],
["Що таке меню програми?",["Список команд","Колір екрана","Назва комп’ютера"],0,"Меню містить команди для роботи у програмі."],
["Яку команду оберемо, щоб зберегти малюнок?",["Закрити","Зберегти","Скасувати"],1,"Команда «Зберегти» записує роботу у файл."],
["Яка команда відкриває готовий файл?",["Відкрити","Друк","Видалити"],0,"Команда «Відкрити» завантажує наявний файл."],
["Де часто розташоване меню програми?",["На клавіатурі","У верхній частині вікна","Під столом"],1,"Меню часто розміщене у верхній частині вікна."],
["Для чого потрібна команда «Друк»?",["Для друку на папері","Для зміни кольору","Для запуску гри"],0,"Команда «Друк» надсилає документ на принтер."],
["Що робить команда «Скасувати»?",["Вмикає комп’ютер","Скасовує останню дію","Зберігає файл"],1,"«Скасувати» допомагає повернутися на один крок назад."],
["Яка програма допомагає писати текст?",["Текстовий редактор","Музичний програвач","Калькулятор"],0,"У текстовому редакторі набирають і редагують текст."],
["Що означає команда «Новий»?",["Створити новий документ","Вимкнути монітор","Видалити клавіатуру"],0,"«Новий» створює новий документ або проєкт."],
["Що робить кнопка × у кутку вікна?",["Збільшує шрифт","Закриває вікно","Малює коло"],1,"Хрестик закриває вікно програми."],
["Що робить команда «Копіювати»?",["Створює копію виділеного","Вимикає комп’ютер","Друкує"],0,"«Копіювати» запам’ятовує копію виділеного."],
["Яка команда додає скопійований текст?",["Вставити","Закрити","Знайти"],0,"«Вставити» розміщує скопійований вміст."],
["Що таке значок програми?",["Маленьке зображення програми","Шнур живлення","Стілець"],0,"Значок допомагає впізнати програму."],
["Чим можна вибрати команду меню?",["Мишею","Лінійкою","Олівцем на папері"],0,"Команду меню можна вибрати вказівником миші."],
["Для чого потрібен калькулятор?",["Для обчислень","Для малювання пензлем","Для запису відео"],0,"Калькулятор виконує математичні обчислення."],
["Що робити перед закриттям незбереженої роботи?",["Зберегти її","Вимкнути світло","Від’єднати мишу"],0,"Щоб не втратити роботу, її потрібно зберегти."],
["Що означає команда «Вирізати»?",["Прибирає виділене для перенесення","Малює ножиці","Збільшує екран"],0,"«Вирізати» прибирає виділений фрагмент, щоб його можна було вставити."],
["Яка програма допомагає переглядати вебсторінки?",["Браузер","Калькулятор","Блокнот для малювання"],0,"Браузер відкриває вебсторінки."],
["Для чого потрібна команда «Довідка»?",["Для отримання допомоги","Для друку фотографії","Для вимкнення екрана"],0,"Довідка пояснює, як користуватися програмою."]
];
let current=0,chosen=-1;const key="newyear-program-menu-grade2-v1";let done=[];try{done=JSON.parse(localStorage.getItem(key)||"[]")}catch(e){};const grid=document.getElementById("grid");const colors=[["#ec364b","#a81134"],["#55aaff","#2257b4"],["#49c86d","#187a4d"],["#b869ec","#6630a2"],["#ffb42d","#d16a0d"],["#33c6ce","#16749e"],["#ff82bc","#bb367a"]];for(let i=0;i<20;i++){const c=colors[i%7],b=document.createElement("button");b.className="tile";b.style.setProperty("--a",c[0]);b.style.setProperty("--b",c[1]);b.innerHTML='<span class="num">'+(i+1)+'</span>';b.onclick=()=>openTask(i);b.setAttribute("aria-label","Відкрити віконце "+(i+1));grid.appendChild(b)}function update(){document.getElementById("count").textContent=done.length;document.getElementById("fill").style.width=done.length*5+"%";[...grid.children].forEach((b,i)=>b.classList.toggle("done",done.includes(i)))}function openTask(i){current=i;chosen=-1;document.getElementById("heading").textContent="🎁 Віконце №"+(i+1);document.getElementById("question").textContent=tasks[i][0];document.getElementById("answers").innerHTML=tasks[i][1].map((x,j)=>'<button class="answer" onclick="choose('+j+')">'+["А","Б","В"][j]+'. '+x+'</button>').join("");document.getElementById("feedback").textContent=done.includes(i)?"⭐ Це віконце вже пройдено!":"";document.getElementById("overlay").classList.add("show")}function choose(i){chosen=i;document.querySelectorAll(".answer").forEach((b,j)=>b.classList.toggle("sel",j===i))}function hint(){document.getElementById("feedback").textContent="💡 Підказка: "+tasks[current][3]}function check(){const f=document.getElementById("feedback");if(chosen<0){f.textContent="Спочатку обери відповідь!";return}const ok=chosen===tasks[current][2];document.querySelectorAll(".answer").forEach((b,j)=>{b.classList.toggle("good",j===tasks[current][2]);b.classList.toggle("bad",j===chosen&&!ok)});f.textContent=(ok?"🎉 Правильно! Отримуєш зірочку! ":"Спробуй ще! ")+tasks[current][3];if(ok&&!done.includes(current)){done.push(current);localStorage.setItem(key,JSON.stringify(done));update();if(done.length===20)f.textContent+=" 🏆 Вітаємо! Усі 20 віконець відкрито!"}}function reveal(){document.getElementById("feedback").textContent="Правильна відповідь: "+tasks[current][1][tasks[current][2]]+". "+tasks[current][3]}function closeModal(){document.getElementById("overlay").classList.remove("show")}document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});update();for(let i=0;i<35;i++){let s=document.createElement("span");s.className="snow";s.textContent="❄";s.style.left=Math.random()*100+"%";s.style.animationDuration=8+Math.random()*15+"s";s.style.animationDelay=-Math.random()*20+"s";s.style.fontSize=10+Math.random()*16+"px";document.body.appendChild(s)}
</script></body></html>
